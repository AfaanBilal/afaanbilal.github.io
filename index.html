<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/assets/afaan.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">

  <!-- Apply persisted/preferred theme before paint to avoid a flash of the wrong theme -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var dark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) { }
    })();
  </script>

  <title>Afaan Bilal &middot; Principal Software Engineer, CISO</title>
  <meta name="keywords"
    content="Afaan Bilal, Software Engineer, Centiment, Full Stack, Rust, Go, SOC2, React, Vue, PHP, Laravel, CISO">
  <meta name="author" content="Afaan Bilal">
  <!-- description, canonical, Open Graph and Twitter tags are set per route in App.vue (useSeoMeta) -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:400,400i,700&display=swap" rel="stylesheet"
    media="print" onload="this.media='all'" />
  <noscript>
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:400,400i,700&display=swap" rel="stylesheet">
  </noscript>

</head>

<body class="bg-white text-gray-700" style="font-family: 'Source Sans Pro', sans-serif;">
